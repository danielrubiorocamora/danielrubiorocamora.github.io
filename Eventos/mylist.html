<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventos Culturales — My List</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="mylist">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" role="banner">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__text">Eventos Culturales</span>
      </div>

      <button id="navToggle" class="icon-btn topbar__burger" aria-label="Open menu" aria-expanded="false" aria-controls="primaryNav">☰</button>

      <nav id="primaryNav" class="nav" aria-label="Primary">
        <a href="./index.html" class="nav__link">Home</a>
        <a href="./events.html" class="nav__link">Events</a>
        <a href="./mylist.html" class="nav__link">My List</a>
        <button id="loginBtn" class="nav__link nav__link--btn" type="button">Login</button>
      </nav>
    </div>
  </header>

  <main id="main" class="container" role="main">
    <section class="profile card card--panel">
      <div class="profile__row">
        <div class="avatar" aria-hidden="true">J</div>
        <div>
          <h1>My List</h1>
          <p class="muted" id="profileSub">Not logged in</p>
        </div>
        <div class="profile__right">
          <button id="logoutBtn" class="btn btn--ghost" type="button" hidden>Logout</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat stat--accent">
          <div class="stat__label">Reserved</div>
          <div class="stat__value" id="reservedCount">0</div>
        </div>
        <div class="stat stat--primary">
          <div class="stat__label">Saved</div>
          <div class="stat__value" id="savedCount">0</div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="My List tabs">
        <button class="tab is-active" id="tabReserved" role="tab" aria-selected="true" aria-controls="panelReserved" type="button">Reserved</button>
        <button class="tab" id="tabSaved" role="tab" aria-selected="false" aria-controls="panelSaved" type="button">Saved</button>
      </div>

      <div class="panels">
        <div id="panelReserved" role="tabpanel" aria-labelledby="tabReserved">
          <div id="reservedGrid" class="cards"></div>
          <div class="empty" id="reservedEmpty" hidden><p>No reserved events yet.</p></div>
        </div>

        <div id="panelSaved" role="tabpanel" aria-labelledby="tabSaved" hidden>
          <div id="savedGrid" class="cards"></div>
          <div class="empty" id="savedEmpty" hidden><p>No saved events yet.</p></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <small>© <span id="year"></span> Eventos Culturales</small>
  </footer>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
    <div class="modal__backdrop" data-close="login"></div>
    <div class="modal__panel" role="document">
      <div class="modal__header">
        <h2 id="loginTitle">Login</h2>
        <button class="icon-btn" type="button" aria-label="Close login" data-close="login">✕</button>
      </div>
      <div class="modal__body">
        <p class="muted">Choose a sign-in method:</p>
        <div class="stack">
          <button class="btn btn--provider" type="button" data-provider="microsoft">Continue with Microsoft Entra ID</button>
          <button class="btn btn--provider" type="button" data-provider="google">Continue with Google</button>
          <button class="btn btn--provider" type="button" data-provider="facebook">Continue with Facebook</button>
        </div>

        <div class="divider divider--tight" role="separator" aria-label="Or"></div>

        <form id="loginForm" class="stack" novalidate>
          <div class="field">
            <label class="label" for="email">Email</label>
            <input id="email" class="input" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input id="password" class="input" type="password" required minlength="6" autocomplete="current-password" />
            <div class="help">Minimum 6 characters.</div>
          </div>
          <div class="alert" id="loginError" role="alert" hidden></div>
          <button class="btn btn--primary" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
