<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Puzzle 4x4 Drag & Drop</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        background:#222;
        color:#fff;
    }
    h1{margin-bottom:.5rem}
    p{margin-bottom:1.5rem}
    .puzzle-wrapper{
        background:#111;
        padding:10px;
        border-radius:16px;
        box-shadow:0 15px 30px rgba(0,0,0,.5);
    }
    .puzzle-grid{
        display:grid;
        gap:3px;
        grid-template-columns:repeat(4,1fr);
        width:min(80vw,520px);
        height:min(80vw,520px);
    }
    .tile{
        border-radius:8px;
        cursor:grab;
        background-repeat:no-repeat;
        background-size:400% 400%; /* 4 x 4 */
        position:relative;
        overflow:hidden;
    }
    .tile::after{
        /* numerito de ayuda */
        content:attr(data-num);
        position:absolute;
        bottom:4px;
        right:6px;
        font-size:.9rem;
        padding:2px 6px;
        border-radius:999px;
        background:rgba(0,0,0,.55);
    }
    .tile.dragging{
        opacity:.75;
        outline:3px solid #ffdd55;
        cursor:grabbing;
    }
    .tile.over{
        outline:3px solid #4dabf7;
    }
    #msg{margin-top:1rem;font-weight:600}
</style>
</head>
<body>
<h1>Puzzle 4x4 🧩</h1>
<p>Arrastra una ficha sobre otra para intercambiarlas y completar la imagen.</p>

<div class="puzzle-wrapper">
    <div id="puzzle" class="puzzle-grid"></div>
</div>

<div id="msg"></div>

<script>
(function () {
    const ROWS = 4;
    const COLS = 4;
    const TOTAL = ROWS * COLS;
    const IMAGE_URL = "miImagen.jpg";  // <-- pon aquí el nombre de tu imagen

    const puzzle = document.getElementById("puzzle");
    const msg = document.getElementById("msg");

    // crea las fichas
    const tiles = [];
    for (let i = 0; i < TOTAL; i++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.draggable = true;
        tile.dataset.index = i;            // posición correcta
        tile.dataset.num = i + 1;

        const row = Math.floor(i / COLS);
        const col = i % COLS;

        tile.style.backgroundImage = `url("${IMAGE_URL}")`;
        tile.style.backgroundPosition = `${(col/(COLS-1))*100}% ${(row/(ROWS-1))*100}%`;

        tiles.push(tile);
    }

    // baraja las fichas
    shuffle(tiles).forEach(t => puzzle.appendChild(t));

    let dragged = null;

    tiles.forEach(tile => {
        tile.addEventListener("dragstart", () => {
            dragged = tile;
            tile.classList.add("dragging");
        });
        tile.addEventListener("dragend", () => {
            if (dragged) dragged.classList.remove("dragging");
            dragged = null;
            clearOver();
        });
        tile.addEventListener("dragover", e => {
            e.preventDefault();
            if (tile !== dragged) {
                tile.classList.add("over");
            }
        });
        tile.addEventListener("dragleave", () => {
            tile.classList.remove("over");
        });
        tile.addEventListener("drop", e => {
            e.preventDefault();
            if (!dragged || dragged === tile) return;

            swapTiles(dragged, tile);
            clearOver();
            checkSolved();
        });
    });

    function swapTiles(a, b) {
        const temp = document.createElement("div");
        puzzle.replaceChild(temp, a);
        puzzle.replaceChild(a, b);
        puzzle.replaceChild(b, temp);
    }

    function clearOver() {
        document.querySelectorAll(".tile.over").forEach(t => t.classList.remove("over"));
    }

    function checkSolved() {
        const current = Array.from(puzzle.children);
        const solved = current.every((t, i) => Number(t.dataset.index) === i);
        if (solved) {
            msg.textContent = "🎉 ¡Puzzle completado!";
        } else {
            msg.textContent = "";
        }
    }

    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
})();
</script>
</body>
</html>
